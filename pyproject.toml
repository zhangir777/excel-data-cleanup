[project]
name = "excel-data-cleanup"
version = "1.0.0"
description = "Clean messy sales/leads tables (CSV, Excel) into a client-ready Excel report"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
clean-table = "cleanup.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cleanup"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
